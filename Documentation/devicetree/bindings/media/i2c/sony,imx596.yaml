%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/sony,imx596.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Sony IMX596 CMOS Image Sensor

maintainers:
  - Linux Media maintainers <linux-media@vger.kernel.org>

description: |-
  The Sony IMX596 is a CMOS active pixel image sensor, used as the 20 MP
  front camera on the Xiaomi Pad 6 Pro (Liuqin). It is programmable through
  I2C and outputs raw Bayer frames over a four-lane MIPI CSI-2 interface.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: sony,imx596

  reg:
    maxItems: 1

  clocks:
    description: 19.2 MHz sensor master clock (XVCLK).
    maxItems: 1

  clock-names:
    items:
      - const: xvclk

  reset-gpios:
    description: Sensor reset (XCLR) GPIO.
    maxItems: 1

  vdda-supply:
    description: Optional analogue sensor supply.

  vddd-supply:
    description: Optional digital core supply.

  vddio-supply:
    description: Optional digital I/O supply.

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          clock-lanes:
            maxItems: 1

          data-lanes:
            items:
              - const: 1
              - const: 2
              - const: 3
              - const: 4

        required:
          - data-lanes
          - link-frequencies

    required:
      - endpoint

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,sm8450-camcc.h>
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@10 {
            compatible = "sony,imx596";
            reg = <0x10>;
            clocks = <&camcc CAM_CC_MCLK5_CLK>;
            clock-names = "xvclk";
            reset-gpios = <&tlmm 127 GPIO_ACTIVE_LOW>;
            vdda-supply = <&camera_front_avdd_ldo>;
            vddd-supply = <&camera_front_vdig_ldo>;
            vddio-supply = <&pm8350c_l1>;
            orientation = <0>;

            port {
                imx596_out: endpoint {
                    clock-lanes = <0>;
                    data-lanes = <1 2 3 4>;
                    link-frequencies = /bits/ 64 <678400000>;
                    remote-endpoint = <&camss_in2>;
                };
            };
        };
    };
...
